# Stack di produzione Viapal sul server Docker di Sandro.
# Reverse proxy esterno: Traefik (rete `web` external).
# Routing per path: Traefik smista /admin, /static, /media, /api, /accounts
# al container `django`; il resto va a `quasar`. Anche `/g/` (galleria
# pubblica) va a Django: serve l'index.html della SPA con i meta Open
# Graph dell'annuncio, che i crawler social non saprebbero ricavare.
#
# Postgres gira sull'HOST (non in Docker): il container raggiunge l'host
# via `host.docker.internal` grazie a `extra_hosts: host-gateway`.
# Settings di produzione iniettate via volume `./local.py` (vedi
# local.py.example).
# Volumi: bind-mount da ./data e ./logs.
#
# Build context = . (repo root). Immagini taggate dal CI come
# ghcr.io/sandroden/viapal-{backend,frontend}:<tag>.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - db

  django:
    image: ${BACKEND_IMAGE:-viapal-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - ./local.py:/code/core/settings/local.py
      - ./data/media:/code/media
      - ./data/media-private:/code/media-private
      - ./logs/uwsgi:/var/log/uwsgi
    networks:
      - db
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.viapal-django.rule=Host(`${HOST:-viapal.e-den.it}`) && PathPrefix(`/admin`, `/static`, `/media`, `/media-private`, `/api`, `/accounts`, `/g/`)"
      - "traefik.http.routers.viapal-django.entrypoints=web-secured"
      - "traefik.http.routers.viapal-django.tls=true"
      - "traefik.http.routers.viapal-django.tls.certresolver=leresolver"
      - "traefik.http.routers.viapal-django.service=viapal-django"
      - "traefik.http.services.viapal-django.loadbalancer.server.port=8000"

  # Proxy S3 read-only sui media di produzione: usato dal dev locale come
  # fallback (jmb.core FallbackStorage, vedi local.py.example sezione SOLO
  # DEV). I bucket coincidono con le cartelle sotto /data: `media` e
  # `media-private`. Chiavi S3_* nel .env (openssl rand -hex 20 / -hex 32).
  s3:
    image: andrewgaul/s3proxy
    restart: unless-stopped
    environment:
      S3PROXY_AUTHORIZATION: aws-v2-or-v4
      S3PROXY_IDENTITY: ${S3_ACCESS_KEY}
      S3PROXY_CREDENTIAL: ${S3_SECRET_KEY}
      S3PROXY_READ_ONLY_BLOBSTORE: "true"
      JCLOUDS_PROVIDER: filesystem-nio2
      JCLOUDS_FILESYSTEM_BASEDIR: /data
      JCLOUDS_REGIONS: local
      LOG_LEVEL: info
    volumes:
      - ./data/media:/data/media:ro
      - ./data/media-private:/data/media-private:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.viapal-s3.rule=Host(`${S3_HOST:-s3.viapal.e-den.it}`)"
      - "traefik.http.routers.viapal-s3.entrypoints=web-secured"
      - "traefik.http.routers.viapal-s3.tls=true"
      - "traefik.http.routers.viapal-s3.tls.certresolver=leresolver"
      - "traefik.http.routers.viapal-s3.service=viapal-s3"
      - "traefik.http.services.viapal-s3.loadbalancer.server.port=80"

  quasar:
    image: ${FRONTEND_IMAGE:-viapal-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    volumes:
      - ./logs/nginx:/var/log/nginx
    networks:
      web:
        # Alias esplicito: `web` è condivisa con gli altri progetti del
        # server, dove il nome di servizio `quasar` è tutt'altro che unico.
        # Django ci prende l'index.html della SPA (SPA_INDEX_URL).
        aliases:
          - viapal-quasar
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.viapal-quasar.rule=Host(`${HOST:-viapal.e-den.it}`)"
      - "traefik.http.routers.viapal-quasar.entrypoints=web-secured"
      - "traefik.http.routers.viapal-quasar.tls=true"
      - "traefik.http.routers.viapal-quasar.tls.certresolver=leresolver"
      - "traefik.http.routers.viapal-quasar.service=viapal-quasar"
      - "traefik.http.services.viapal-quasar.loadbalancer.server.port=80"

networks:
  db:
  web:
    external: true
